name: 毎日のチャンネル記録

on:
  schedule:
    # 毎日 日本時間 6:17 に実行（UTC 21:17）
    - cron: "17 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: pip install cryptography==44.0.0

      - name: データ取得・アドバイス生成
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python scripts/collect.py

      - name: 記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.enc
          git diff --cached --quiet || git commit -m "データ更新 $(TZ=Asia/Tokyo date +%F)"
          git push
